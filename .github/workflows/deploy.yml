name: Desplegar Docusaurus a GitHub Pages

on:
  push:
    branches:
      - main # Cambia a 'master' si tu rama principal se llama así

# Permisos necesarios para interactuar con GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que ejecuciones simultáneas cancelen o pisen despliegues anteriores
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Compilar sitio
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 20 # Docusaurus 3 requiere Node.js >= 18.0
          cache: npm # Cambia a 'yarn' o 'pnpm' si usas otro gestor

      - name: Instalar dependencias
        run: npm ci # Cambia a 'yarn install --immutable' o 'pnpm install' si aplica

      - name: Compilar producción
        run: npm run build

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build # Docusaurus genera el sitio aquí por defecto

  deploy:
    name: Desplegar sitio
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
